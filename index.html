<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1017" />
  <title>Raid Messaoui — Software Solutions Developer</title>
  <meta name="description" content="Connect with Raid Messaoui, Software Solutions Developer. Portfolio, Attendify System, WhatsApp, Gmail, and Facebook." />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Raid Messaoui — Software Solutions Developer" />
  <meta property="og:description" content="Official links for Raid Messaoui — Portfolio, Attendify System, and direct contact." />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Geometric network mesh matching the business card -->
  <canvas id="network-bg" aria-hidden="true"></canvas>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="page">
    <section class="card" aria-label="Raid Messaoui Links">
      <!-- Subtle cyan corner brackets inspired by the business card -->
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <!-- Profile Header -->
      <header class="profile">
        <div class="logo-wrap">
          <img src="assets/RM_Logo.svg" alt="Raid Messaoui Logo" class="logo" width="96" height="68" />
        </div>

        <h1 class="brand-name">
          <span class="brand-first">RAID</span>
          <span class="brand-last">MESSAOUI</span>
        </h1>

        <div class="accent-divider" aria-hidden="true">
          <span class="accent-bar"></span>
        </div>

        <p class="brand-bio">Software Solutions Developer</p>
      </header>

      <!-- Links List -->
      <nav class="links" aria-label="Primary links">
        <!-- 1. Portfolio -->
        <a
          class="link-item link-item--featured"
          href="https://portfolio-web-site-lime.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9.5" />
              <ellipse cx="12" cy="12" rx="4.2" ry="9.5" />
              <line x1="2.8" y1="12" x2="21.2" y2="12" />
              <line x1="4.5" y1="7.5" x2="19.5" y2="7.5" />
              <line x1="4.5" y1="16.5" x2="19.5" y2="16.5" />
            </svg>
          </span>
          <span class="link-text">
            <span class="link-title">Portfolio</span>
            <span class="link-sub">Projects, skills &amp; case studies</span>
          </span>
          <span class="link-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8" />
            </svg>
          </span>
        </a>

        <!-- 2. Attendify System -->
        <a
          class="link-item"
          href="https://attendify-landing-page-woad.vercel.app/fr"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2.5" />
              <path d="M8 12l2.6 2.6L16.5 8.8" />
            </svg>
          </span>
          <span class="link-text">
            <span class="link-title">Attendify System</span>
            <span class="link-sub">Smart attendance management solution</span>
          </span>
          <span class="link-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8" />
            </svg>
          </span>
        </a>

        <!-- 3. WhatsApp -->
        <a
          class="link-item"
          href="https://wa.me/213797057598"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 11.7a8.5 8.5 0 0 1-12.5 7.5L3.5 20.5l1.3-4.3a8.5 8.5 0 1 1 15.7-4.5z" />

              <path d="M7 17L17 7M9 7h8v8" />

        <!-- 4. Gmail (with quick copy button) -->
        <div class="link-row">
          <a
            class="link-item link-item--with-action"
            href="mailto:anissemessaoui2016@gmail.com"
          >
            <span class="link-icon" aria-hidden="true">

                <rect x="2.5" y="5" width="19" height="14" rx="2" />
                <path d="M3.5 6.5l8.5 6.5 8.5-6.5" />
              </svg>
            </span>
            <span class="link-text">
              <span class="link-title">Gmail</span>
              <span class="link-sub">anissemessaoui2016@gmail.com</span>
            </span>
          </a>
          <button
            type="button"
            class="copy-btn"
            data-copy="anissemessaoui2016@gmail.com"
            aria-label="Copy email address"
            title="Copy email address"
          >
            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 13l4 4L19 7" />
            </svg>
          </button>
        </div>

        <!-- 5. Facebook -->
        <a
          class="link-item"
          href="https://www.facebook.com/raid.mess.79/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h-2.5A4.5 4.5 0 0 0 8 7.5V10H5.5v3.5H8V21h3.8v-7.5h2.9l.5-3.5h-3.4V7.8c0-.8.5-1.3 1.4-1.3H15V3z" />

            <span class="link-title">Facebook</span>
            <span class="link-sub">@raid.mess.79</span>

          <span class="link-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <!-- Footer -->

        <span>&copy; <span id="year">2026</span> RAID MESSAOUI</span>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Email copied to clipboard</div>

  <script src="script.js"></script>
</body>
</html>
